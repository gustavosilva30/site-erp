# Servidor da loja (VPS Oracle). Preencha o .env a partir do .env.example e rode: docker compose up -d --build
services:
  loja:
    build: .
    restart: unless-stopped
    environment:
      ERP_API_URL: ${ERP_API_URL:?defina ERP_API_URL no .env}
      DEFAULT_STORE_SLUG: ${DEFAULT_STORE_SLUG:-}
    # Sem "ports": so o Caddy alcanca a loja, e assim ninguem forja o cabecalho do dominio direto nela.
    expose:
      - "3100"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - loja
    ports:
      - "80:80"
      - "443:443"
    environment:
      ERP_API_URL: ${ERP_API_URL}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
